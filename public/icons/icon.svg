<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#121826"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>

    <!-- Sun / Golden Hour Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sunDisk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Fog Layers -->
    <linearGradient id="fogGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Camera Aperture / Lens Ring -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Base background square with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Stars in sky -->
  <circle cx="110" cy="110" r="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="160" cy="80" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="380" cy="95" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="420" cy="140" r="2.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="95" cy="180" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="430" cy="70" r="2" fill="#ffffff" opacity="0.6"/>

  <!-- Star sparkle -->
  <path d="M 220 90 Q 220 105 235 105 Q 220 105 220 120 Q 220 105 205 105 Q 220 105 220 90 Z" fill="#38bdf8" opacity="0.85"/>

  <!-- Outer Camera Aperture Circle Glow -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ringGrad)" stroke-width="6" opacity="0.6"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.3"/>

  <!-- Sun Glow Atmosphere -->
  <circle cx="256" cy="210" r="120" fill="url(#sunGlow)" opacity="0.65"/>

  <!-- Rising/Setting Sun -->
  <circle cx="256" cy="210" r="56" fill="url(#sunDisk)"/>

  <!-- Mountain Silhouettes -->
  <path d="M 90 380 L 190 280 L 260 340 L 330 260 L 422 380 Z" fill="#0f172a" opacity="0.95"/>

  <!-- Layered Mist / Fog bands -->
  <!-- Low fog wave 1 -->
  <path d="M 80 330 Q 170 310 260 330 T 432 330" fill="none" stroke="url(#fogGrad)" stroke-width="14" stroke-linecap="round"/>
  <!-- Low fog wave 2 -->
  <path d="M 95 365 Q 180 380 270 360 T 417 365" fill="none" stroke="url(#fogGrad)" stroke-width="18" stroke-linecap="round"/>
  <!-- Low fog wave 3 -->
  <path d="M 120 400 Q 240 385 392 400" fill="none" stroke="url(#fogGrad)" stroke-width="16" stroke-linecap="round" opacity="0.7"/>

  <!-- Camera Aperture blades / marks -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#64748b" stroke-width="2" opacity="0.3"/>
  <line x1="256" y1="36" x2="256" y2="48" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="464" x2="256" y2="476" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <line x1="36" y1="256" x2="48" y2="256" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <line x1="464" y1="256" x2="476" y2="256" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
</svg>
